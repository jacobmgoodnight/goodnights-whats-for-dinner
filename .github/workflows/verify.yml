name: Verify Goodnights
on:
  push:
    branches: [main, feature/restaurant-brand-icons]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GW_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling outside the frontend
        run: |
          npm install --prefix "$RUNNER_TEMP/gw-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/gw-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "GW_PLAYWRIGHT_MODULE=$RUNNER_TEMP/gw-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Synthetic mobile journeys (no database credentials)
        run: |
          node tests/browser/invitations.cjs
          node tests/browser/onboarding.cjs
          node tests/browser/one-time.cjs
          node tests/browser/ballots.cjs
          node tests/browser/release.cjs
          node tests/browser/location-saving.cjs
          node tests/browser/organizer-planning.cjs
  sql-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GW_SQL_CI_SERVICE: 'true'
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SQL client outside the frontend
        run: |
          npm install --prefix "$RUNNER_TEMP/gw-pg" --no-save --ignore-scripts pg@8.23.1
          echo "GW_PG_RUNTIME=$RUNNER_TEMP/gw-pg/node_modules" >> "$GITHUB_ENV"
      - name: Synthetic fresh install and one-time poll boundaries
        run: node tests/sql/one-time-polls.cjs
